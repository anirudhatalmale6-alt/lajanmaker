     which is a second page doing exactly the same job - keep the two in step. -->

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

        border:3px solid rgba(255,255,255,.28);border-top-color:#fff;
        animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .wait{font-size:13px;color:#c9d8ff;margin:0 0 22px}

       font-weight:700;font-size:15.5px;color:#fff;
